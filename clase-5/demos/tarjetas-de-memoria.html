<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjetas de memoria</title>
<style>
  :root{
    --navy:#1a2140;
    --muted:#64748b;
    --cherry:#a8203f;
    --cherry-dark:#7a1830;
    --royal:#2d4fa3;
    --royal-dark:#1f3a7a;
    --gold:#f5b942;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{
    display:flex;align-items:center;justify-content:center;padding:28px;
    min-height:100vh;
    background:linear-gradient(135deg,#1a2140 0%,var(--cherry) 48%,var(--royal) 100%);
    background-size:220% 220%;
    animation:driftBg 16s ease-in-out infinite;
  }
  @keyframes driftBg{
    0%,100%{background-position:0% 30%;}
    50%{background-position:100% 70%;}
  }
  .frame{
    width:min(100%,780px);
    background:var(--card);
    border-radius:26px;
    padding:clamp(26px,4vw,42px);
    box-shadow:0 30px 70px rgba(10,10,30,.35),0 6px 18px rgba(10,10,30,.2);
    color:var(--navy);
    position:relative;
    overflow:hidden;
  }
  .frame::before{
    content:"";position:absolute;top:-80px;left:-80px;width:220px;height:220px;
    background:radial-gradient(circle, rgba(245,185,66,.3), transparent 70%);
    pointer-events:none;
  }

  header{text-align:center;margin-bottom:16px;position:relative;z-index:1;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--cherry);background:#fdecef;padding:5px 14px;border-radius:999px;margin-bottom:10px;
  }
  h1{
    font-size:clamp(1.3rem,3.6vw,1.75rem);font-weight:800;margin:0 0 8px;
    background:linear-gradient(90deg,var(--cherry),var(--royal));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{color:var(--muted);font-size:.9rem;margin:0 auto;max-width:480px;line-height:1.5;}

  .progress-wrap{
    height:10px;background:#eef1f8;border-radius:999px;overflow:hidden;margin:16px 0 22px;
    position:relative;z-index:1;
  }
  .progress-fill{
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--cherry),var(--gold),var(--royal));
    transition:width .35s ease;
  }
  .progress-label{
    text-align:center;font-size:.82rem;font-weight:700;color:var(--muted);margin:-14px 0 16px;position:relative;z-index:1;
  }
  .progress-label.win{ color:#16a34a; }

  .cards-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:22px;
    position:relative;z-index:1;
  }
  @media (max-width:640px){ .cards-grid{ grid-template-columns:repeat(2,1fr);} }

  .card{
    perspective:1200px;
    height:185px;
    cursor:pointer;
  }
  @media (max-width:640px){
    .card{ height:230px; }
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1), box-shadow .2s ease;
    transform-style:preserve-3d;
  }
  .card:hover .card-inner{ transform:translateY(-3px); }
  .card.flipped:hover .card-inner{ transform:rotateY(180deg) translateY(-3px); }
  .card.flipped .card-inner{ transform:rotateY(180deg); }

  .card-face{
    position:absolute;inset:0;
    border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    text-align:center;padding:14px;
    backface-visibility:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.14);
  }
  .card-front{
    background:#fbfbfe;color:var(--navy);
    font-weight:800;font-size:1.02rem;
    border:2px solid var(--accent, #e2e8f0);
  }
  .card-front .icon{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
    background:var(--accent, #e2e8f0);
  }
  .card-back{
    background:linear-gradient(145deg,var(--accent,#a8203f) 0%,var(--accent-dark,#7a1830) 100%);
    color:#fff;
    transform:rotateY(180deg);
    font-size:.82rem;line-height:1.42;font-weight:600;
  }
  .card-back .icon{ font-size:1.2rem; }

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:1;}
  button.btn-main{
    appearance:none;border:none;cursor:pointer;
    font-weight:800;font-size:.88rem;padding:11px 24px;border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.btn-main:hover{ transform:translateY(-2px); }
  .btn-flip{
    background:#f1f5f9;color:var(--navy);border:2px solid #e2e8f0;
  }
  .btn-shuffle{
    background:linear-gradient(90deg,var(--cherry),var(--royal));color:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.2);
  }

  .confetti{
    position:fixed;top:-10px;left:0;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:50;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0; }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <span class="eyebrow">🧠 Memoria</span>
    <h1>Tarjetas de memoria</h1>
    <p class="subtitle">Tocá cada tarjeta para descubrir su definición. Términos básicos de IA generativa.</p>
  </header>

  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
  <p class="progress-label" id="progressLabel">0 de 6 términos descubiertos.</p>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="actions">
    <button class="btn-main btn-flip" id="btnFlipAll">Dar vuelta todas</button>
    <button class="btn-main btn-shuffle" id="btnShuffle">↻ Mezclar</button>
  </div>
</div>

<script>
  const TERMS = [
    { term: "Prompt", icon: "✍️", color: "#12a37f", def: "La instrucción que le das a un modelo de IA para que genere algo." },
    { term: "Alucinación", icon: "🌀", color: "#d9704f", def: "Cuando un modelo genera información que suena creíble pero es falsa o inventada." },
    { term: "Modelo multimodal", icon: "🧩", color: "#4a6cc2", def: "Un modelo que entiende o genera más de un tipo de contenido (texto, imagen, audio, video) a la vez." },
    { term: "Fine-tuning", icon: "🎯", color: "#7a4fd9", def: "Ajustar un modelo ya entrenado con datos propios para que se especialice en una tarea puntual." },
    { term: "Token", icon: "🧱", color: "#e0528f", def: "La unidad mínima de texto que procesa un modelo de lenguaje: una palabra, parte de una palabra, o un signo." },
    { term: "Contexto", icon: "📚", color: "#e8863f", def: "La información previa que el modelo tiene disponible al momento de generar una respuesta." },
  ];

  const grid = document.getElementById("cardsGrid");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  let seen = new Set();

  function shade(hex, percent) {
    const num = parseInt(hex.replace("#", ""), 16);
    let r = (num >> 16) + percent;
    let g = ((num >> 8) & 0x00FF) + percent;
    let b = (num & 0x0000FF) + percent;
    r = Math.min(255, Math.max(0, r));
    g = Math.min(255, Math.max(0, g));
    b = Math.min(255, Math.max(0, b));
    return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
  }

  function launchConfetti() {
    const colors = ["#a8203f", "#2d4fa3", "#f5b942", "#16a34a", "#e0528f"];
    for (let i = 0; i < 46; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      el.style.left = Math.random() * 100 + "vw";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (2 + Math.random() * 1.5) + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  function updateProgress() {
    const n = seen.size;
    progressFill.style.width = (n / TERMS.length * 100) + "%";
    if (n === TERMS.length) {
      progressLabel.textContent = "🎉 ¡Descubriste los 6 términos!";
      progressLabel.classList.add("win");
      launchConfetti();
    } else {
      progressLabel.textContent = `${n} de ${TERMS.length} términos descubiertos.`;
      progressLabel.classList.remove("win");
    }
  }

  function markSeen(idx) {
    if (!seen.has(idx)) {
      seen.add(idx);
      updateProgress();
    }
  }

  function render(order) {
    grid.innerHTML = "";
    order.forEach((idx) => {
      const item = TERMS[idx];
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-front" style="--accent:${item.color}">
            <span class="icon">${item.icon}</span>
            <span>${item.term}</span>
          </div>
          <div class="card-face card-back" style="--accent:${item.color};--accent-dark:${shade(item.color, -28)}">
            <span class="icon">${item.icon}</span>
            <span>${item.def}</span>
          </div>
        </div>
      `;
      card.addEventListener("click", () => {
        card.classList.toggle("flipped");
        if (card.classList.contains("flipped")) markSeen(idx);
      });
      grid.appendChild(card);
    });
  }

  function shuffledIndexes(n) {
    const arr = [...Array(n).keys()];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  document.getElementById("btnFlipAll").addEventListener("click", () => {
    const cards = [...grid.children];
    const allFlipped = cards.every(c => c.classList.contains("flipped"));
    cards.forEach((c, i) => {
      c.classList.toggle("flipped", !allFlipped);
      if (!allFlipped) markSeen(i);
    });
  });

  document.getElementById("btnShuffle").addEventListener("click", () => {
    seen = new Set();
    updateProgress();
    render(shuffledIndexes(TERMS.length));
  });

  render(shuffledIndexes(TERMS.length));
  updateProgress();
</script>
</body>
</html>
