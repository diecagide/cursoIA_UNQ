<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las partes de un prompt</title>
<style>
  :root{
    --navy:#0f172a;
    --muted:#64748b;
    --cherry:#a8203f;
    --royal:#2d4fa3;
    --card:#ffffff;
    --gold:#ffd93d;

    --rol:#4a6cc2;        --rol-bg:#e4eafc;
    --tarea:#12a37f;      --tarea-bg:#d9f5ec;
    --tema:#e8863f;       --tema-bg:#fdecd9;
    --formato:#7a4fd9;    --formato-bg:#ece2fc;
    --restriccion:#e0528f; --restriccion-bg:#fce3ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:28px 16px;
    background:linear-gradient(120deg,var(--navy) 0%,var(--cherry) 50%,var(--royal) 100%);
    background-size:200% 200%;
    animation:bgShift 18s ease-in-out infinite;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  @media (prefers-reduced-motion: reduce){ body{animation:none;} }

  .frame{
    width:min(100%,760px);
    background:var(--card);
    border-radius:26px;
    padding:clamp(26px,4vw,42px);
    box-shadow:0 28px 64px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.18);
    color:var(--navy);
  }

  header{text-align:center;margin-bottom:20px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--cherry) 0%,var(--royal) 100%);
    color:#fff;font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;
    padding:6px 14px;border-radius:999px;margin-bottom:12px;
  }
  h1{
    font-size:clamp(1.4rem,3.8vw,1.85rem);font-weight:800;margin:0 0 10px;
    background:linear-gradient(120deg,var(--cherry) 0%,var(--royal) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{color:#475569;font-size:.92rem;margin:0 auto;max-width:460px;line-height:1.5;}

  .progress-row{display:flex;align-items:center;gap:10px;margin:20px 0 20px;}
  .progress-track{flex:1 1 auto;height:8px;border-radius:99px;background:#eef1f6;overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--tarea) 0%,var(--royal) 100%);transition:width .4s ease;}
  .progress-label{font-size:.78rem;font-weight:700;color:#64748b;white-space:nowrap;}

  .prompt-box{
    background:#f8fafc;border-radius:18px;padding:24px 26px;
    font-size:clamp(1.02rem,2.6vw,1.22rem);line-height:2.1;
    margin:0 0 20px;
    border:1.5px solid #eef1f6;
  }

  .hotspot{
    cursor:pointer;border-radius:8px;padding:3px 6px;position:relative;
    transition:filter .15s ease, box-shadow .15s ease, transform .15s ease;
    outline-offset:2px;
  }
  .hotspot:hover{ filter:brightness(0.96); transform:translateY(-1px); }
  .hotspot:focus-visible{ outline:2.5px solid currentColor; }
  .hotspot.active{ box-shadow:0 0 0 2.5px currentColor inset; font-weight:800; }
  .hotspot.pulse{ animation:pulseHint 1.8s ease-in-out 2; }
  @keyframes pulseHint{
    0%,100%{ box-shadow:0 0 0 0 currentColor inset; }
    50%{ box-shadow:0 0 0 2.5px currentColor inset; }
  }
  .hotspot[data-cat="rol"]{ background:var(--rol-bg); color:var(--rol); }
  .hotspot[data-cat="tarea"]{ background:var(--tarea-bg); color:var(--tarea); }
  .hotspot[data-cat="tema"]{ background:var(--tema-bg); color:var(--tema); }
  .hotspot[data-cat="formato"]{ background:var(--formato-bg); color:var(--formato); }
  .hotspot[data-cat="restriccion"]{ background:var(--restriccion-bg); color:var(--restriccion); }

  .legend{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px;
  }
  .legend-item{
    appearance:none;cursor:pointer;position:relative;
    display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;
    padding:8px 14px 8px 10px;border-radius:999px;
    border:2px solid transparent;
    transition:transform .15s ease, border-color .2s ease;
  }
  .legend-item:hover{ transform:translateY(-1px); }
  .legend-icon{
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:.8rem;
    background:#fff;
  }
  .legend-item[data-cat="rol"]{ color:var(--rol); background:var(--rol-bg); }
  .legend-item[data-cat="tarea"]{ color:var(--tarea); background:var(--tarea-bg); }
  .legend-item[data-cat="tema"]{ color:var(--tema); background:var(--tema-bg); }
  .legend-item[data-cat="formato"]{ color:var(--formato); background:var(--formato-bg); }
  .legend-item[data-cat="restriccion"]{ color:var(--restriccion); background:var(--restriccion-bg); }
  .legend-item.active{ border-color:currentColor; }
  .legend-check{
    position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;
    background:#1fa55a;color:#fff;font-size:.6rem;font-weight:900;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.5);transition:opacity .2s ease,transform .2s ease;
  }
  .legend-check.show{ opacity:1;transform:scale(1); }

  .detail{
    background:#f1f5fb;border-radius:16px;padding:20px 22px;min-height:92px;
    display:flex;gap:14px;align-items:flex-start;
  }
  .detail-icon{
    flex:0 0 auto;width:40px;height:40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;
    background:#fff;
  }
  .detail-body{flex:1 1 auto;}
  .detail .d-cat{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .detail p{margin:0;color:#334155;font-size:.93rem;line-height:1.55;}
  .detail-body, .detail-icon{
    animation:fadeIn .25s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(4px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .confetti{
    position:fixed;top:-10px;border-radius:2px;pointer-events:none;z-index:999;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg);opacity:.15;}
  }

  @media (max-width:420px){
    .prompt-box{ padding:20px; line-height:2.3; }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <span class="eyebrow">🧩 Actividad interactiva</span>
    <h1>Las partes de un prompt</h1>
    <p class="subtitle">Tocá cada parte resaltada del prompt (o la categoría de abajo) para entender qué función cumple.</p>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 5 exploradas</span>
  </div>

  <div class="prompt-box" id="promptBox"></div>

  <div class="legend" id="legend"></div>

  <div class="detail" id="detail">
    <span class="detail-icon">👆</span>
    <div class="detail-body">
      <p>Elegí una parte del prompt para ver su explicación acá.</p>
    </div>
  </div>
</div>

<script>
  const PARTS = [
    { cat: "rol", label: "Rol", icon: "🎭", text: "Actuás como un profesor universitario de biología", explain: "Le indica al modelo qué papel debe adoptar — eso ajusta su tono y su nivel de conocimiento experto." },
    { cat: "tarea", label: "Tarea", icon: "🎯", text: "necesito que generes un cuestionario de 5 preguntas", explain: "La acción concreta que el modelo tiene que realizar." },
    { cat: "tema", label: "Tema / contexto", icon: "📚", text: "sobre el proceso de fotosíntesis", explain: "De qué tema específico tiene que tratar el contenido generado." },
    { cat: "formato", label: "Formato", icon: "📐", text: "en formato de tabla", explain: "Cómo tiene que presentarse el resultado." },
    { cat: "restriccion", label: "Restricción", icon: "🚫", text: "sin usar vocabulario técnico complejo", explain: "Qué cosas el modelo debe evitar al generar la respuesta." },
  ];

  const promptBox = document.getElementById("promptBox");
  const legend = document.getElementById("legend");
  const detail = document.getElementById("detail");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");

  const visited = new Set();
  let confettiLaunched = false;

  PARTS.forEach((p, i) => {
    const span = document.createElement("span");
    span.className = "hotspot pulse";
    span.dataset.cat = p.cat;
    span.dataset.idx = i;
    span.textContent = p.text;
    span.tabIndex = 0;
    span.setAttribute("role", "button");
    span.setAttribute("aria-label", `${p.label}: ${p.text}`);
    promptBox.appendChild(span);
    if (i < PARTS.length - 1) promptBox.appendChild(document.createTextNode(" "));

    const legendItem = document.createElement("button");
    legendItem.type = "button";
    legendItem.className = "legend-item";
    legendItem.dataset.cat = p.cat;
    legendItem.dataset.idx = i;
    legendItem.innerHTML = `<span class="legend-icon">${p.icon}</span>${p.label}<span class="legend-check" id="check-${i}">✓</span>`;
    legend.appendChild(legendItem);
  });

  function updateProgress() {
    const n = visited.size;
    progressFill.style.width = (n / PARTS.length) * 100 + "%";
    progressLabel.textContent = `${n} / ${PARTS.length} exploradas`;
    if (n === PARTS.length && !confettiLaunched) {
      confettiLaunched = true;
      launchConfetti();
    }
  }

  function launchConfetti() {
    const colors = ["var(--rol)", "var(--tarea)", "var(--tema)", "var(--formato)", "var(--restriccion)", "var(--gold)"];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      const size = 6 + Math.random() * 6;
      el.style.width = size + "px";
      el.style.height = size * 0.5 + "px";
      el.style.left = Math.random() * 100 + "vw";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = 2.4 + Math.random() * 1.6 + "s";
      el.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }

  function select(idx) {
    const p = PARTS[idx];
    document.querySelectorAll(".hotspot").forEach(el => {
      el.classList.toggle("active", Number(el.dataset.idx) === idx);
      el.classList.remove("pulse");
    });
    document.querySelectorAll(".legend-item").forEach(el => {
      el.classList.toggle("active", Number(el.dataset.idx) === idx);
    });

    detail.innerHTML = `
      <span class="detail-icon">${p.icon}</span>
      <div class="detail-body">
        <div class="d-cat" style="color:var(--${p.cat})">${p.label}</div>
        <p>${p.explain}</p>
      </div>
    `;

    visited.add(idx);
    const check = document.getElementById(`check-${idx}`);
    if (check) check.classList.add("show");
    updateProgress();
  }

  document.querySelectorAll(".hotspot, .legend-item").forEach(el => {
    el.addEventListener("click", () => select(Number(el.dataset.idx)));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        select(Number(el.dataset.idx));
      }
    });
  });
</script>
</body>
</html>
