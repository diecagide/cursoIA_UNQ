<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificá las herramientas</title>
<style>
  :root{
    --navy:#0f172a;
    --muted:#64748b;
    --blue:#2563eb;
    --blue-bg:#dbeafe;
    --green:#16a34a;
    --green-bg:#dcfce7;
    --red:#ef4444;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#eef2f6;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .frame{
    width:min(100%,760px);
    background:var(--card);
    border-radius:22px;
    padding:clamp(26px,4vw,40px);
    box-shadow:0 24px 60px rgba(15,23,42,.14),0 4px 14px rgba(15,23,42,.08);
    color:var(--navy);
  }
  header{text-align:center;margin-bottom:20px;}
  h1{font-size:clamp(1.25rem,3.4vw,1.6rem);font-weight:800;margin:0 0 8px;}
  .subtitle{color:var(--muted);font-size:.9rem;margin:0;}

  .tray{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    padding:16px;margin:18px 0;background:#f8fafc;border-radius:14px;
    min-height:54px;
  }
  .chip{
    appearance:none;border:none;cursor:pointer;
    background:#fff;color:var(--navy);font-weight:700;font-size:.88rem;
    padding:9px 16px;border-radius:999px;border:2px solid #e2e8f0;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
    transition:transform .12s ease, border-color .15s ease;
  }
  .chip.selected{ border-color:var(--blue); transform:translateY(-2px); }
  .chip:active{cursor:grabbing;}

  .bins{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  @media (max-width:560px){ .bins{grid-template-columns:1fr;} }
  .bin{
    border-radius:14px;padding:16px;min-height:140px;
    border:2px dashed #cbd5e1;
    display:flex;flex-direction:column;gap:8px;
  }
  .bin-texto{ background:var(--blue-bg); }
  .bin-imagen{ background:var(--green-bg); }
  .bin-title{font-weight:800;font-size:.9rem;text-align:center;margin-bottom:6px;}
  .bin-texto .bin-title{color:var(--blue);}
  .bin-imagen .bin-title{color:var(--green);}
  .bin.drag-over{ outline:3px solid currentColor; }

  .bin .chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  }
  .bin .chip.correct{border-color:var(--green);}
  .bin .chip.wrong{border-color:var(--red); animation:shake .4s;}

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  .status{text-align:center;font-weight:700;font-size:.92rem;min-height:1.3em;margin-bottom:12px;color:var(--muted);}

  .actions{display:flex;justify-content:center;}
  button.btn-reset{
    appearance:none;border:none;cursor:pointer;
    background:#f1f5f9;color:var(--navy);font-weight:700;font-size:.88rem;
    padding:10px 22px;border-radius:999px;
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>¿Texto o imagen?</h1>
    <p class="subtitle">Tocá una herramienta y después tocá la categoría que le corresponde (también podés arrastrarla).</p>
  </header>

  <div class="tray" id="tray"></div>

  <div class="bins">
    <div class="bin bin-texto" id="bin-texto" data-category="texto">
      <div class="bin-title">Genera principalmente texto</div>
    </div>
    <div class="bin bin-imagen" id="bin-imagen" data-category="imagen">
      <div class="bin-title">Genera principalmente imagen</div>
    </div>
  </div>

  <p class="status" id="status"></p>

  <div class="actions">
    <button class="btn-reset" id="btnReset">Reiniciar</button>
  </div>
</div>

<script>
  const ITEMS = [
    { name: "ChatGPT", category: "texto" },
    { name: "Claude", category: "texto" },
    { name: "Gemini", category: "texto" },
    { name: "Midjourney", category: "imagen" },
    { name: "DALL·E", category: "imagen" },
    { name: "Stable Diffusion", category: "imagen" },
  ];

  const tray = document.getElementById("tray");
  const bins = [...document.querySelectorAll(".bin")];
  const statusEl = document.getElementById("status");
  let selectedChip = null;
  let placedCount = 0;

  function updateStatus() {
    statusEl.textContent = placedCount === ITEMS.length
      ? "¡Listo! Clasificaste todas."
      : `${placedCount} de ${ITEMS.length} clasificadas.`;
  }

  function makeChip(item) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = item.name;
    chip.draggable = true;
    chip.dataset.category = item.category;

    chip.addEventListener("click", () => {
      if (selectedChip === chip) {
        chip.classList.remove("selected");
        selectedChip = null;
        return;
      }
      if (selectedChip) selectedChip.classList.remove("selected");
      selectedChip = chip;
      chip.classList.add("selected");
    });

    chip.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", item.name);
      e.dataTransfer.effectAllowed = "move";
      selectedChip = chip;
    });

    return chip;
  }

  function placeChip(chip, bin) {
    const correct = chip.dataset.category === bin.dataset.category;
    if (correct) {
      chip.classList.add("correct");
      chip.disabled = true;
      chip.draggable = false;
      bin.appendChild(chip);
      placedCount++;
      updateStatus();
    } else {
      chip.classList.add("wrong");
      setTimeout(() => {
        chip.classList.remove("wrong");
        tray.appendChild(chip);
      }, 420);
    }
    if (selectedChip === chip) selectedChip = null;
    [...document.querySelectorAll(".chip.selected")].forEach(c => c.classList.remove("selected"));
  }

  bins.forEach(bin => {
    bin.addEventListener("click", () => {
      if (selectedChip && !selectedChip.disabled) placeChip(selectedChip, bin);
    });
    bin.addEventListener("dragover", (e) => {
      e.preventDefault();
      bin.classList.add("drag-over");
    });
    bin.addEventListener("dragleave", () => bin.classList.remove("drag-over"));
    bin.addEventListener("drop", (e) => {
      e.preventDefault();
      bin.classList.remove("drag-over");
      if (selectedChip && !selectedChip.disabled) placeChip(selectedChip, bin);
    });
  });

  function init() {
    tray.innerHTML = "";
    bins.forEach(bin => {
      [...bin.querySelectorAll(".chip")].forEach(c => c.remove());
    });
    placedCount = 0;
    selectedChip = null;
    const order = [...ITEMS.keys()];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.forEach(i => tray.appendChild(makeChip(ITEMS[i])));
    updateStatus();
  }

  document.getElementById("btnReset").addEventListener("click", init);

  init();
</script>
</body>
</html>
