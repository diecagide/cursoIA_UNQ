<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Línea de tiempo — IA generativa</title>
<style>
  :root{
    --navy:#0f172a;
    --blue:#2563eb;
    --muted:#64748b;
    --card:#ffffff;
    --line:#e2e8f0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#eef2f6;}
  body{display:flex;align-items:center;justify-content:center;padding:24px;}
  .frame{
    width:min(100%,920px);
    background:var(--card);
    border-radius:22px;
    padding:clamp(26px,4vw,40px);
    box-shadow:0 24px 60px rgba(15,23,42,.14),0 4px 14px rgba(15,23,42,.08);
    color:var(--navy);
  }
  header{text-align:center;margin-bottom:28px;}
  h1{font-size:clamp(1.3rem,3.4vw,1.7rem);font-weight:800;margin:0 0 8px;}
  .subtitle{color:var(--muted);font-size:.92rem;margin:0;}

  .timeline{
    position:relative;
    display:flex;
    justify-content:space-between;
    padding:0 6px;
    margin-bottom:28px;
  }
  .timeline::before{
    content:"";position:absolute;left:0;right:0;top:17px;height:3px;background:var(--line);
    border-radius:3px;
  }
  .milestone{
    position:relative;z-index:1;
    background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    flex:1 1 0;
    padding:0 2px;
  }
  .dot{
    width:16px;height:16px;border-radius:50%;background:#cbd5e1;border:3px solid #fff;
    box-shadow:0 0 0 2px var(--line);
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .milestone.active .dot{
    background:var(--blue);
    box-shadow:0 0 0 2px var(--blue);
    transform:scale(1.25);
  }
  .year{font-size:.78rem;font-weight:700;color:var(--muted);}
  .milestone.active .year{color:var(--blue);}

  .detail{
    background:#f1f5fb;border-radius:16px;padding:22px 24px;
    min-height:120px;
  }
  .detail .d-year{font-size:.78rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
  .detail h2{font-size:1.15rem;margin:0 0 8px;font-weight:800;}
  .detail p{margin:0;color:#334155;line-height:1.55;font-size:.95rem;}

  @media (max-width:640px){
    .timeline{flex-direction:column;align-items:flex-start;gap:18px;padding-left:10px;}
    .timeline::before{left:17px;top:0;bottom:0;right:auto;width:3px;height:auto;}
    .milestone{flex-direction:row;align-items:center;}
    .year{min-width:56px;text-align:left;}
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>La evolución de la IA generativa</h1>
    <p class="subtitle">Tocá un hito de la línea de tiempo para ver más información.</p>
  </header>

  <nav class="timeline" id="timeline"></nav>

  <div class="detail" id="detail"></div>
</div>

<script>
  const MILESTONES = [
    { year: "2014", title: "Redes generativas antagónicas (GANs)", text: "Aparecen los primeros modelos capaces de generar imágenes sintéticas realistas, entrenando dos redes neuronales que compiten entre sí." },
    { year: "2017", title: "La arquitectura Transformer", text: "Un paper de Google (\"Attention is all you need\") presenta la arquitectura que, años después, haría posibles a los grandes modelos de lenguaje." },
    { year: "2020", title: "GPT-3", text: "OpenAI lanza un modelo de lenguaje capaz de generar textos coherentes y versátiles a partir de un simple prompt, marcando un salto de escala." },
    { year: "2022", title: "ChatGPT y Stable Diffusion", text: "La IA generativa llega al público masivo: una interfaz conversacional simple, y modelos de imagen accesibles para cualquiera." },
    { year: "2023–24", title: "Modelos multimodales", text: "Los modelos empiezan a combinar texto, imagen, audio y video en una misma herramienta, entendiendo y generando distintos formatos a la vez." },
    { year: "2025–26", title: "Agentes y herramientas integradas", text: "La IA pasa de responder preguntas a ejecutar tareas completas, combinando varios modelos y herramientas — como vimos con Google Flow en la Clase 4." },
  ];

  const timelineEl = document.getElementById("timeline");
  const detailEl = document.getElementById("detail");

  function renderDetail(idx) {
    const m = MILESTONES[idx];
    detailEl.innerHTML = `
      <div class="d-year">${m.year}</div>
      <h2>${m.title}</h2>
      <p>${m.text}</p>
    `;
  }

  function selectMilestone(idx) {
    [...timelineEl.children].forEach((btn, i) => btn.classList.toggle("active", i === idx));
    renderDetail(idx);
  }

  MILESTONES.forEach((m, i) => {
    const btn = document.createElement("button");
    btn.className = "milestone";
    btn.innerHTML = `<span class="dot"></span><span class="year">${m.year}</span>`;
    btn.addEventListener("click", () => selectMilestone(i));
    timelineEl.appendChild(btn);
  });

  selectMilestone(0);
</script>
<script>
(function(){
  if (window.parent === window) return; // abierto directo fuera de un iframe: no hace nada

  // OJO con esta función: NO usar document.documentElement.scrollHeight
  // ni document.body.scrollHeight para medir el alto real. El alto de
  // scroll del elemento raíz de un documento (sea página normal o
  // adentro de un iframe) nunca baja del alto de su propio viewport,
  // así el contenido real sea más chico — es una particularidad de
  // cómo miden los navegadores el elemento raíz, no un bug de este
  // archivo. Por eso acá se mide el punto más bajo real de los hijos
  // directos de <body> (más su padding inferior), que sí refleja el
  // contenido real sin importar cuánto mida el iframe en ese momento.
  function medirAltura(){
    var maxBottom = 0;
    var kids = document.body.children;
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      var cs = window.getComputedStyle(el);
      if (cs.display === "none" || cs.position === "fixed") continue;
      var r = el.getBoundingClientRect();
      if (r.bottom > maxBottom) maxBottom = r.bottom;
    }
    var padBottom = parseFloat(window.getComputedStyle(document.body).paddingBottom) || 0;
    var h = Math.ceil(maxBottom + padBottom);
    if (h < 10) h = document.documentElement.scrollHeight; // resguardo si no hubiera hijos medibles
    return h;
  }

  // Un ResizeObserver sobre <body> se vuelve a disparar solo CADA VEZ que
  // el padre cambia el alto del iframe (cambia el viewport interno), así
  // el contenido no haya cambiado un píxel. Sin este "debounce" (esperar
  // a que se calme la seguidilla de eventos antes de medir una sola vez)
  // esos disparos en cadena podían, con el redondeo acumulado, hacer
  // crecer el iframe de a poco sin parar. Y si el nuevo valor es
  // prácticamente igual al último que se mandó, directamente no se
  // vuelve a avisar — así el padre no tiene ningún motivo para volver a
  // tocar el alto y la cadena de eventos se corta sola.
  var ultimoEnviado = null;
  var pendiente = null;
  function enviarAltura(){
    if (pendiente) clearTimeout(pendiente);
    pendiente = setTimeout(function(){
      pendiente = null;
      var h = medirAltura();
      if (ultimoEnviado !== null && Math.abs(h - ultimoEnviado) <= 2) return;
      ultimoEnviado = h;
      window.parent.postMessage({ type: "device-resize", height: h }, "*");
    }, 180);
  }

  window.addEventListener("load", enviarAltura);
  window.addEventListener("resize", enviarAltura);
  if (window.ResizeObserver) {
    new ResizeObserver(enviarAltura).observe(document.body);
  } else {
    setInterval(enviarAltura, 700);
  }
  enviarAltura();
})();
</script>
</body>
</html>
