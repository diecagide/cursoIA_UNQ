<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordená los pasos</title>
<style>
  :root{
    --navy:#0f172a;
    --cherry:#a8203f;
    --cherry-dark:#7a1730;
    --royal:#2d4fa3;
    --gold:#ffd93d;
    --teal:#12a37f;
    --terracota:#d9704f;
    --azul:#4a6cc2;
    --violeta:#7a4fd9;
    --rosa:#e0528f;
    --naranja:#e8863f;
    --green:#1fa55a;
    --red:#e23b3b;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:28px 16px;
    background:linear-gradient(120deg,var(--navy) 0%,var(--cherry) 50%,var(--royal) 100%);
    background-size:200% 200%;
    animation:bgShift 18s ease-in-out infinite;
  }
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  @media (prefers-reduced-motion: reduce){
    body{animation:none;}
  }

  .frame{
    width:min(100%,640px);
    border-radius:26px;
    padding:clamp(26px,5vw,42px);
    background:var(--card);
    box-shadow:0 28px 64px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.18);
    color:var(--navy);
  }

  header{text-align:center;margin-bottom:22px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--cherry) 0%,var(--royal) 100%);
    color:#fff;font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;
    padding:6px 14px;border-radius:999px;margin-bottom:12px;
  }
  h1{
    font-size:clamp(1.4rem,3.8vw,1.9rem);font-weight:800;margin:0 0 10px;
    background:linear-gradient(120deg,var(--cherry) 0%,var(--royal) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .subtitle{font-size:.94rem;color:#475569;line-height:1.55;margin:0 auto;max-width:480px;}

  .progress-row{display:flex;align-items:center;gap:10px;margin:18px 0 6px;}
  .progress-track{flex:1 1 auto;height:8px;border-radius:99px;background:#eef1f6;overflow:hidden;}
  .progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--teal) 0%,var(--royal) 100%);transition:width .35s ease;}
  .progress-label{font-size:.78rem;font-weight:700;color:#64748b;white-space:nowrap;}

  .steps-list{list-style:none;margin:18px 0 20px;padding:0;display:flex;flex-direction:column;gap:12px;position:relative;}
  .step{
    --accent:#64748b;
    background:#fff;color:var(--navy);
    border-radius:16px;padding:12px 14px 12px 12px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 6px 16px rgba(15,23,42,.1);
    border:2.5px solid #eef1f6;
    touch-action:none;
    user-select:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .25s ease, background .25s ease;
  }
  .step.dragging{
    box-shadow:0 18px 34px rgba(15,23,42,.28);
    border-color:var(--accent);
    z-index:5;
    cursor:grabbing;
  }
  .step.settle{transition:transform .22s ease, box-shadow .18s ease, border-color .25s ease, background .25s ease;}

  .step .slot{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#f1f4f9;color:#64748b;font-weight:800;font-size:.85rem;
    transition:background .2s ease,color .2s ease;
  }
  .step .icon-badge{
    flex:0 0 auto;width:38px;height:38px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:1.15rem;
    background:color-mix(in srgb, var(--accent) 16%, white);
  }
  .step .handle{font-size:1.15rem;color:#b7c0cf;flex:0 0 auto;cursor:grab;padding:4px;line-height:1;}
  .step.dragging .handle{cursor:grabbing;}
  .step .step-text{flex:1 1 auto;font-weight:600;font-size:.93rem;line-height:1.35;}
  .step .mark{flex:0 0 auto;font-size:1.2rem;opacity:0;transform:scale(.6);transition:opacity .2s ease,transform .2s ease;}
  .step .mark.show{opacity:1;transform:scale(1);}

  .step .arrows{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;}
  .step .arrows button{
    appearance:none;border:none;background:#f1f4f9;color:var(--navy);
    width:26px;height:22px;border-radius:7px;cursor:pointer;font-size:.72rem;
    display:flex;align-items:center;justify-content:center;
  }
  .step .arrows button:hover{background:#dde4ee;}
  .step .arrows button:disabled{opacity:.25;cursor:default;}

  .step.is-correct{border-color:var(--green);background:#f1fbf5;}
  .step.is-correct .slot{background:var(--green);color:#fff;}
  .step.is-wrong{border-color:var(--red);background:#fef2f2;animation:shake .35s ease;}
  .step.is-wrong .slot{background:var(--red);color:#fff;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  button.btn-main{
    appearance:none;border:none;cursor:pointer;
    font-weight:800;font-size:.95rem;padding:12px 26px;border-radius:999px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #btnCheck{background:linear-gradient(135deg,var(--teal) 0%,#0c7f63 100%);color:#fff;box-shadow:0 10px 22px rgba(18,163,127,.35);}
  #btnReset{background:#eef1f6;color:var(--navy);box-shadow:none;}
  button.btn-main:hover{transform:translateY(-2px);}
  button.btn-main:active{transform:translateY(0);}

  .feedback{text-align:center;margin-top:16px;font-size:.92rem;font-weight:700;min-height:1.3em;color:#334155;}
  .feedback.win{color:var(--green);}

  .confetti{
    position:fixed;top:-10px;border-radius:2px;pointer-events:none;z-index:999;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg);opacity:.15;}
  }

  @media (max-width:420px){
    .step .icon-badge{width:32px;height:32px;font-size:1rem;}
    .step .slot{width:26px;height:26px;font-size:.78rem;}
    .step .step-text{font-size:.88rem;}
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <span class="eyebrow">🧩 Actividad interactiva</span>
    <h1>Ordená los pasos</h1>
    <p class="subtitle">Arrastrá las tarjetas (o usá las flechas) hasta dejarlas en el orden correcto para armar un buen prompt.</p>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 5 en su lugar</span>
  </div>

  <ol class="steps-list" id="stepsList"></ol>

  <div class="actions">
    <button class="btn-main" id="btnCheck">Verificar orden</button>
    <button class="btn-main" id="btnReset">Reiniciar</button>
  </div>
  <p class="feedback" id="feedbackMsg"></p>
</div>

<script>
  const STEPS = [
    { text: "Definí el objetivo: qué querés que la IA genere exactamente.", icon: "🎯", color: "var(--teal)" },
    { text: "Dale contexto: contale a la IA quién sos y para qué lo vas a usar.", icon: "🗣️", color: "var(--terracota)" },
    { text: "Especificá el formato de salida: lista, tabla, código, una extensión determinada.", icon: "📐", color: "var(--azul)" },
    { text: "Agregá restricciones o ejemplos de lo que sí (o no) querés.", icon: "📋", color: "var(--violeta)" },
    { text: "Revisá el resultado y ajustá el prompt si hace falta.", icon: "🔁", color: "var(--rosa)" },
  ];

  const listEl = document.getElementById("stepsList");
  const feedbackEl = document.getElementById("feedbackMsg");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");

  let dragState = null;

  function shuffledIndexes(n) {
    const arr = [...Array(n).keys()];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    if (arr.every((v, i) => v === i)) return shuffledIndexes(n);
    return arr;
  }

  function render(order) {
    listEl.innerHTML = "";
    order.forEach((correctIdx) => {
      const step = STEPS[correctIdx];
      const li = document.createElement("li");
      li.className = "step";
      li.style.setProperty("--accent", step.color);
      li.dataset.correct = correctIdx;
      li.innerHTML = `
        <span class="handle" aria-hidden="true">⠿</span>
        <span class="icon-badge">${step.icon}</span>
        <span class="step-text">${step.text}</span>
        <span class="mark" aria-hidden="true"></span>
        <span class="slot"></span>
        <span class="arrows">
          <button type="button" class="up" aria-label="Subir">▲</button>
          <button type="button" class="down" aria-label="Bajar">▼</button>
        </span>
      `;
      listEl.appendChild(li);
    });
    wireItems();
    updateSlots();
    clearFeedback();
  }

  function updateSlots() {
    [...listEl.children].forEach((li, i) => {
      li.querySelector(".slot").textContent = i + 1;
    });
  }

  function wireItems() {
    const items = [...listEl.children];
    items.forEach((li, i) => {
      li.querySelector(".up").disabled = i === 0;
      li.querySelector(".down").disabled = i === items.length - 1;

      li.querySelector(".up").onclick = () => {
        const prev = li.previousElementSibling;
        if (prev) listEl.insertBefore(li, prev);
        afterReorder();
      };
      li.querySelector(".down").onclick = () => {
        const next = li.nextElementSibling;
        if (next) listEl.insertBefore(next, li);
        afterReorder();
      };

      li.querySelector(".handle").onpointerdown = (e) => startDrag(e, li);
    });
  }

  function afterReorder() {
    clearFeedback();
    wireItems();
    updateSlots();
  }

  function startDrag(e, li) {
    e.preventDefault();
    li.setPointerCapture?.(e.pointerId);
    const rect = li.getBoundingClientRect();
    dragState = {
      li,
      pointerId: e.pointerId,
      offsetY: e.clientY - rect.top,
      height: rect.height,
    };
    li.classList.add("dragging");
    li.classList.remove("settle");
    li.style.zIndex = 5;

    window.addEventListener("pointermove", onDragMove);
    window.addEventListener("pointerup", onDragEnd);
  }

  function onDragMove(e) {
    if (!dragState) return;
    const { li } = dragState;
    const listRect = listEl.getBoundingClientRect();
    let y = e.clientY - listRect.top - dragState.offsetY + dragState.height / 2;
    y = Math.max(0, Math.min(y, listRect.height));

    const siblings = [...listEl.children].filter((el) => el !== li);
    let targetIndex = siblings.length;
    for (let i = 0; i < siblings.length; i++) {
      const sibRect = siblings[i].getBoundingClientRect();
      const sibMid = sibRect.top + sibRect.height / 2 - listRect.top;
      if (y < sibMid) { targetIndex = i; break; }
    }
    const currentOrder = [...listEl.children];
    const targetEl = siblings[targetIndex];
    if (targetEl && currentOrder.indexOf(targetEl) !== currentOrder.indexOf(li) + 1) {
      listEl.insertBefore(li, targetEl);
      updateSlots();
    } else if (!targetEl && li !== listEl.lastElementChild) {
      listEl.appendChild(li);
      updateSlots();
    }
  }

  function onDragEnd(e) {
    if (!dragState) return;
    const { li } = dragState;
    li.classList.remove("dragging");
    li.classList.add("settle");
    li.style.zIndex = "";
    window.removeEventListener("pointermove", onDragMove);
    window.removeEventListener("pointerup", onDragEnd);
    dragState = null;
    clearFeedback();
    wireItems();
  }

  function clearFeedback() {
    feedbackEl.textContent = "";
    feedbackEl.classList.remove("win");
    [...listEl.children].forEach((li) => {
      li.classList.remove("is-correct", "is-wrong");
      li.querySelector(".mark").classList.remove("show");
      li.querySelector(".mark").textContent = "";
    });
    progressFill.style.width = "0%";
    progressLabel.textContent = `0 / ${STEPS.length} en su lugar`;
  }

  function launchConfetti() {
    const colors = ["var(--teal)", "var(--terracota)", "var(--azul)", "var(--violeta)", "var(--rosa)", "var(--naranja)", "var(--gold)"];
    for (let i = 0; i < 60; i++) {
      const el = document.createElement("div");
      el.className = "confetti";
      const size = 6 + Math.random() * 6;
      el.style.width = size + "px";
      el.style.height = size * 0.5 + "px";
      el.style.left = Math.random() * 100 + "vw";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = 2.4 + Math.random() * 1.6 + "s";
      el.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }

  document.getElementById("btnCheck").addEventListener("click", () => {
    const items = [...listEl.children];
    let correctCount = 0;
    items.forEach((li, pos) => {
      const correctIdx = Number(li.dataset.correct);
      const mark = li.querySelector(".mark");
      if (correctIdx === pos) {
        li.classList.add("is-correct");
        li.classList.remove("is-wrong");
        mark.textContent = "✓";
        mark.classList.add("show");
        correctCount++;
      } else {
        li.classList.add("is-wrong");
        li.classList.remove("is-correct");
        mark.textContent = "✕";
        mark.classList.add("show");
      }
    });

    progressFill.style.width = (correctCount / items.length) * 100 + "%";
    progressLabel.textContent = `${correctCount} / ${items.length} en su lugar`;

    if (correctCount === items.length) {
      feedbackEl.textContent = "¡Perfecto! Ese es el orden.";
      feedbackEl.classList.add("win");
      launchConfetti();
    } else {
      feedbackEl.textContent = `Tenés ${correctCount} de ${items.length} en el lugar correcto. Seguí ajustando.`;
      feedbackEl.classList.remove("win");
    }
  });

  document.getElementById("btnReset").addEventListener("click", () => {
    render(shuffledIndexes(STEPS.length));
  });

  render(shuffledIndexes(STEPS.length));
</script>
</body>
</html>
